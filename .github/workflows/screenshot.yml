name: Screenshot Dashboard

on:
  workflow_dispatch:  # Manual trigger
  repository_dispatch:
    types: [take-screenshots]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Puppeteer
        run: npm install puppeteer
        
      - name: Take Screenshots
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          
          const PAGES = [
            { name: 'dashboard', path: '/#/dashboard' },
            { name: 'products', path: '/#/products' },
            { name: 'inventory', path: '/#/inventory' },
          ];
          
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900 });
            
            fs.mkdirSync('screenshots', { recursive: true });
            
            for (const p of PAGES) {
              await page.goto('https://capyera.github.io/capy-inventory' + p.path, { waitUntil: 'networkidle2' });
              await new Promise(r => setTimeout(r, 3000));
              await page.screenshot({ path: `screenshots/${p.name}.png` });
              console.log('✅ ' + p.name);
            }
            
            await browser.close();
          })();
          EOF
          
      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: screenshots/
          retention-days: 7
